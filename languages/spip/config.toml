name = "SPIP"
grammar = "spip"
path_suffixes = ["spip"]
block_comment = ["[(#REM) ", " ]"]
word_characters = ["-", "_", "#"]
tab_size = 4
hard_tabs = false

# Caractères devant lesquels l'auto-close se déclenche encore (sinon : espace / fin de ligne seulement)
autoclose_before = ";:.,=}])>"

# Paires de brackets : auto-close (close) + enveloppe la sélection (surround).
# not_in désactive l'auto-close dans les commentaires [(#REM)…] et le texte multi.
brackets = [
  { start = "{", end = "}", close = true, surround = true, newline = true, not_in = ["comment", "string"] },
  { start = "[", end = "]", close = true, surround = true, newline = false, not_in = ["comment", "string"] },
  { start = "(", end = ")", close = true, surround = true, newline = false, not_in = ["comment", "string"] },
]

# Scopes référencés par `not_in` ci-dessus. Doivent correspondre à des captures de highlights.scm
# (@comment ligne 7-8, @string ligne 54). Les sections peuvent rester vides : leur seule présence
# enregistre le scope d'override — ne pas les supprimer sous peine de casser `not_in`.
[overrides.comment]

[overrides.string]
